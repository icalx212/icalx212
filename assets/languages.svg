<svg width="760" height="330" viewBox="0 0 760 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F2F2F2"/>
      <stop offset="100%" stop-color="#CFCFCF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="760" height="330" rx="18" fill="#0D0D0D" stroke="#242424"/>

  <text x="38" y="48" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700">current stack</text>
  <text x="38" y="72" fill="#777777" font-family="JetBrains Mono, monospace" font-size="12">languages i'm currently using &amp; learning</text>

  <g font-family="JetBrains Mono, monospace" font-size="14" font-weight="600" fill="#FFFFFF">
    <text x="38" y="116">Python</text>
    <text x="38" y="158">C++</text>
    <text x="38" y="200">HTML</text>
    <text x="38" y="242">CSS</text>
    <text x="38" y="284">JavaScript</text>
  </g>

  <g>
    <rect x="150" y="103" width="555" height="14" rx="7" fill="#1A1A1A"/>
    <rect x="150" y="145" width="555" height="14" rx="7" fill="#1A1A1A"/>
    <rect x="150" y="187" width="555" height="14" rx="7" fill="#1A1A1A"/>
    <rect x="150" y="229" width="555" height="14" rx="7" fill="#1A1A1A"/>
    <rect x="150" y="271" width="555" height="14" rx="7" fill="#1A1A1A"/>

    <rect x="150" y="103" width="0" height="14" rx="7" fill="url(#white)" filter="url(#glow)">
      <animate attributeName="width" values="0;490;490;0" dur="4.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="150" y="145" width="0" height="14" rx="7" fill="url(#white)" filter="url(#glow)">
      <animate attributeName="width" values="0;380;380;0" dur="4.8s" begin="0.25s" repeatCount="indefinite"/>
    </rect>
    <rect x="150" y="187" width="0" height="14" rx="7" fill="url(#white)" filter="url(#glow)">
      <animate attributeName="width" values="0;325;325;0" dur="4.8s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="150" y="229" width="0" height="14" rx="7" fill="url(#white)" filter="url(#glow)">
      <animate attributeName="width" values="0;300;300;0" dur="4.8s" begin="0.75s" repeatCount="indefinite"/>
    </rect>
    <rect x="150" y="271" width="0" height="14" rx="7" fill="url(#white)" filter="url(#glow)">
      <animate attributeName="width" values="0;215;215;0" dur="4.8s" begin="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
