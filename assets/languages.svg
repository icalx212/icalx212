<svg width="760" height="360" viewBox="0 0 760 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D6D6D6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0.75" y="0.75" width="758.5" height="358.5" rx="18" fill="#0D0D0D" stroke="#242424" stroke-width="1.5"/>

  <text x="38" y="46" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700">Languages</text>
  <text x="38" y="69" fill="#777777" font-family="JetBrains Mono, monospace" font-size="12">languages i'm currently using &amp; learning</text>

  <!-- Python -->
  <g transform="translate(120 167)">
    <circle r="58" stroke="#1A1A1A" stroke-width="10"/>
    <circle r="58" stroke="url(#white)" stroke-width="10" stroke-linecap="round" pathLength="100" transform="rotate(-90)"
      stroke-dasharray="0 100" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0 100;72 100;72 100;0 100" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-4" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" text-anchor="middle">Python</text>
    <text x="0" y="18" fill="#808080" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">72%</text>
  </g>

  <!-- C++ -->
  <g transform="translate(260 167)">
    <circle r="58" stroke="#1A1A1A" stroke-width="10"/>
    <circle r="58" stroke="url(#white)" stroke-width="10" stroke-linecap="round" pathLength="100" transform="rotate(-90)"
      stroke-dasharray="0 100" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0 100;61 100;61 100;0 100" dur="5s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-4" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" text-anchor="middle">C++</text>
    <text x="0" y="18" fill="#808080" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">61%</text>
  </g>

  <!-- HTML -->
  <g transform="translate(400 167)">
    <circle r="58" stroke="#1A1A1A" stroke-width="10"/>
    <circle r="58" stroke="url(#white)" stroke-width="10" stroke-linecap="round" pathLength="100" transform="rotate(-90)"
      stroke-dasharray="0 100" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0 100;48 100;48 100;0 100" dur="5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-4" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" text-anchor="middle">HTML</text>
    <text x="0" y="18" fill="#808080" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">48%</text>
  </g>

  <!-- CSS -->
  <g transform="translate(540 167)">
    <circle r="58" stroke="#1A1A1A" stroke-width="10"/>
    <circle r="58" stroke="url(#white)" stroke-width="10" stroke-linecap="round" pathLength="100" transform="rotate(-90)"
      stroke-dasharray="0 100" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0 100;44 100;44 100;0 100" dur="5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-4" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700" text-anchor="middle">CSS</text>
    <text x="0" y="18" fill="#808080" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">44%</text>
  </g>

  <!-- JavaScript -->
  <g transform="translate(680 167)">
    <circle r="58" stroke="#1A1A1A" stroke-width="10"/>
    <circle r="58" stroke="url(#white)" stroke-width="10" stroke-linecap="round" pathLength="100" transform="rotate(-90)"
      stroke-dasharray="0 100" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0 100;31 100;31 100;0 100" dur="5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-4" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" text-anchor="middle">JavaScript</text>
    <text x="0" y="18" fill="#808080" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">31%</text>
  </g>

  <text x="380" y="298" fill="#555555" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">current stack • visual showcase</text>
</svg>
